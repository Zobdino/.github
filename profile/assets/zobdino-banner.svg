<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Zobdino</title>
  <desc id="desc">Persian book summaries and audio learning, built in the open.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#18122b"/>
      <stop offset="1" stop-color="#25143f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1080" cy="120" r="310" fill="url(#glow)"/>
  <circle cx="170" cy="560" r="240" fill="url(#glow)" opacity=".55"/>
  <text x="105" y="290" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="92" font-weight="800">Zobdino</text>
  <text x="108" y="360" fill="#c4b5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="33" font-weight="600">Persian book summaries · Farsi audio learning</text>
  <text x="108" y="422" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">Open-source AI research, TTS, audio QA and verifiable publishing</text>
  <text x="108" y="520" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">zobdino.ir</text>
